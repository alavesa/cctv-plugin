# CCTV configuration. /cctv reload re-reads this file. Camera records live in cameras.yml.

storage:
  # cameras.yml is written (asynchronously, atomically) at most this often when something changed
  autosave-seconds: 5

placement:
  # gap between the clicked block face and the lens, blocks
  offset: 0.3
  # starting downward tilt per mount, degrees (positive = down)
  default-pitch:
    wall: 15
    ceiling: 35
    floor: 0
  # floor/ceiling cameras face the way the placing player looks, snapped to this many degrees (0 = no snap)
  yaw-snap: 15
  # refuse to place a camera this close to another one, blocks
  min-spacing: 0.6

damage:
  # whether players (with cctv.damage) can hurt cameras at all; the API can always damage them
  players-can-damage: true
  melee: 2.0
  projectile: 4.0
  # explosion damage at the centre, falling off linearly to 0 at the radius
  explosion: 20.0
  explosion-radius: 5.0
  # below this fraction of max health the camera reports DAMAGED (still viewable, glitchier feed in later phases)
  damaged-threshold: 0.5

repair:
  # right-click a camera holding this item (needs cctv.repair)
  item: IRON_INGOT
  # optional: also require this item_model on the repair item, e.g. "cctv:repair_kit". Empty = any item of that material
  item-model: ""
  amount: 5.0
  consume: true

ptz:
  # motor step interval in ticks; the client interpolates between steps over the same number of ticks.
  # 1 = smoothest for viewers (the view follows the motor), and only moving cameras cost anything
  update-ticks: 1
  # sound event played while a PTZ head turns (the resource pack defines cctv:camera.motor; empty = silent)
  motor-sound: "cctv:camera.motor"
  motor-volume: 0.6
  motor-pitch: 1.0
  # ticks between motor sound starts while moving (match it to the length of your motor sound)
  motor-sound-interval: 10

item:
  # base material for placement items and display models. It must not be placeable as a block.
  material: PAPER

hitbox:
  # interaction box centred on the lens, blocks
  width: 0.5
  height: 0.5

view:
  # ticks between spawning the camera anchor and attaching the view: the client must know the entity first
  attach-delay-ticks: 3
  # static burst when a feed starts or switches, ticks
  transition-ticks: 8
  # static when the player exits, ticks
  exit-transition-ticks: 6
  # "SIGNAL LOST" before the player is restored after the body was hurt or the camera died, ticks
  signal-lost-ticks: 20
  # what stays where the player started viewing, so others can see (and hurt) them:
  #   auto      FancyNpcs player NPC if FancyNpcs is installed, otherwise a Mannequin
  #   fancynpcs FancyNpcs NPC (falls back to a Mannequin if FancyNpcs is missing)
  #   mannequin vanilla Mannequin entity (also takes arrows and explosions)
  #   none      nothing (the player just vanishes while viewing)
  # hurting the body pulls the player out of the camera ("SIGNAL LOST")
  body: auto
  # after being pulled out, the player takes the damage the body took
  forward-damage: true
  # camera goes offline mid-view: switch (to the next working camera in the network) | exit
  on-camera-lost: switch
  # A/D (and Ctrl+A/D) skip cameras that are offline
  switch-skips-offline: true
  zoom:
    # dolly: the view moves forward along its line of sight (works on 26.2 and 26.3, full resolution)
    # digital: 26.3 post-effect crop (pixelated, like a cheap digital zoom) | both
    mode: dolly
    # dolly: the view moves toward what is in the centre so it looks N times bigger (1 - 1/N of the distance),
    # at most this many blocks per level above 1x, and never closer than 0.6 blocks to a surface
    blocks-per-level: 5
  # how far ahead of the PTZ motor a held key aims, seconds of motor travel
  ptz-lookahead-seconds: 0.15
  # control help shown at the start of a feed, seconds
  help-seconds: 4
  # only send post effects to players whose client confirmed the CCTV pack loaded (otherwise HUD only)
  require-pack-for-effects: true
  sounds:
    switch: "cctv:feed.switch"
    lost: "cctv:signal.lost"

hud:
  # half width of the HUD box in font pixels (1 font px = 2 GUI px). 100 fits 16:9 at GUI scale 3-4;
  # lower it if corners clip on narrow windows or large GUI scales
  half-width: 100
  date-format: "yyyy-MM-dd"
  time-format: "HH:mm:ss"

effects:
  # auto: Player.postEffects() on Minecraft 26.3+, the mob backend on 26.2
  # paper | command (/posteffect as console, 26.3+) | mob (the camera anchor is an invisible creeper/spider/
  # enderman; the CCTV pack turns their vanilla spectator shaders into the CCTV looks) | none (HUD only)
  backend: auto
  # health fraction below which the feed shows signal_weak / signal_critical
  weak-signal-below: 0.5
  critical-signal-below: 0.25

pack:
  # auto: same-port, else http | same-port: served on the Minecraft port (no extra port to open; not behind
  # Velocity/Bungee) | http: built-in web server on pack.http.port (players must reach that port) |
  # url: you host plugins/CCTV/cctv-pack.zip, set pack.url | none: you merged the CCTV pack into another pack (docs/MERGE.md)
  delivery: auto
  http:
    port: 8164
    bind: "0.0.0.0"
    # host name clients use to download; empty = the address each player connected with
    public-host: ""
  url: ""
  # kick players who decline the pack
  required: false
  prompt: "<gray>CCTV: camera models and camera-feed screen effects"
  # delivery none only: count ANY successfully loaded pack as the CCTV pack (otherwise assumed always present)
  trust-any-pack: false
  # build the pack from this folder inside plugins/CCTV/ instead of the copy in the jar ("" = jar)
  source-folder: ""

monitors:
  render:
    # map pixels per rendered pixel: 1 = full 128 px per block (best, default), 2 = 64 px upscaled (a quarter of the
    # CPU), 4 = 32 px. The governor raises it automatically when the server lags.
    scale: 1
    # frames per second per watched monitor (0.1 - 10); bandwidth is ~16 KB per tile per frame per watcher
    fps: 2.0
    # how far the camera "sees" for monitors, blocks
    max-distance: 48
    # a monitor renders only while a player is within this many blocks, in front of it
    watch-radius: 16
    # ... and can actually see it (one block ray-trace per player per monitor every 10 ticks)
    watch-needs-line-of-sight: true
    # main-thread time per tick for capturing chunk snapshots (all monitors together), milliseconds
    ms-budget-per-tick: 2.0
    # render threads (rendering never runs on the main thread)
    threads: 2
    # chunk snapshots are reused this long (block changes in a chunk drop its snapshot early)
    chunk-cache-seconds: 8
    # send each new frame to watchers immediately (otherwise vanilla item-frame updates, every 10 ticks)
    push-frames: true
  # snapshot mode (and the governor's last level): one frame every this many seconds
  snapshot-interval-seconds: 2.0
  boot-seconds: 2.0
  # static burst when a cycling monitor switches camera, ticks
  switch-static-ticks: 10
  default-cycle-seconds: 8
  hum-sound: "cctv:monitor.hum"
  # ticks between hum sounds while someone watches (0 = silent); match the length of your hum sound
  hum-interval-ticks: 60
  # TPS protection: above high-mspt the frame rate halves, then resolution halves, then snapshot mode
  governor:
    high-mspt: 45
    low-mspt: 35
  # Monitor types. mount: WALL (place on a wall, width x height tiles) | DESK (1x1, place on top of a block)
  # screen: crt (default: curved glass, scanlines, rolling bar, a bezel per tile like a wall of monitors) |
  #   flat (flat-screen TV: sharp picture, one thin frame round the whole screen, blue no-signal screen)
  # style: color | green | amber | thermal (night-vision cameras show green, thermal cameras thermal, anyway)
  # model.bezel: item model of the frame; with model.edges: true it is a prefix and each tile uses <bezel>_<0..15>
  #   with only the screen's outer edges (bits 1 top, 2 bottom, 4 left, 8 right; see docs/ASSETS.md)
  types:
    desk:
      name: "<white>Desk Monitor"
      mount: DESK
      width: 1
      height: 1
      style: color
      model: {bezel: "cctv:monitor_desk"}
    wall:
      name: "<white>Wall Monitor"
      mount: WALL
      width: 1
      height: 1
      style: color
      model: {bezel: "cctv:monitor_tile", placer: "cctv:monitor_wall_item"}
    wall_2x2:
      name: "<white>Monitor Wall 2x2"
      mount: WALL
      width: 2
      height: 2
      style: color
      model: {bezel: "cctv:monitor_tile", placer: "cctv:monitor_wall_item"}
    wall_3x2:
      name: "<white>Monitor Wall 3x2"
      mount: WALL
      width: 3
      height: 2
      style: color
      model: {bezel: "cctv:monitor_tile", placer: "cctv:monitor_wall_item"}
    green_crt:
      name: "<green>Green CRT"
      mount: DESK
      width: 1
      height: 1
      style: green
      model: {bezel: "cctv:monitor_desk"}
    # ---- flat-screen TVs ----
    tv:
      name: "<white>Flat-Screen TV"
      mount: WALL
      width: 1
      height: 1
      screen: flat
      style: color
      model: {bezel: "cctv:tv_tile", edges: true, placer: "cctv:tv_wall_item"}
    tv_2x2:
      name: "<white>Flat-Screen TV 2x2"
      mount: WALL
      width: 2
      height: 2
      screen: flat
      style: color
      model: {bezel: "cctv:tv_tile", edges: true, placer: "cctv:tv_wall_item"}
    tv_3x2:
      name: "<white>Flat-Screen TV 3x2"
      mount: WALL
      width: 3
      height: 2
      screen: flat
      style: color
      model: {bezel: "cctv:tv_tile", edges: true, placer: "cctv:tv_wall_item"}
    tv_desk:
      name: "<white>Desk TV"
      mount: DESK
      width: 1
      height: 1
      screen: flat
      style: color
      model: {bezel: "cctv:tv_desk"}

terminals:
  model: "cctv:terminal"
  # clearance new terminals require (change per terminal with /cctv terminal clearance <id|here> <n>)
  default-clearance: 0

alerts:
  # cameras that see a player inside a restricted zone of their network raise an alert
  # (zones: /cctv zone pos1, /cctv zone pos2, /cctv zone create <name> <network>)
  enabled: true
  # how often zones are checked, ticks
  interval-ticks: 10
  # how far a camera can spot someone, blocks
  range: 32
  # the same camera / zone / player alerts again only after this long
  cooldown-seconds: 15
  # how long a camera stays in alert after the last sighting
  alert-seconds: 10
  sound: "cctv:alert"
  # who is told: viewers of that network, plus everyone with cctv.alert.receive.
  # never alerts on: cctv.alert.exempt, cctv.zone.exempt.<zone>, or when another plugin cancels CameraAlertEvent

# Camera types. Every key is free to change; add as many types as you like.
#   model.head    item model of the turning lens part (must exist in the resource pack)
#   model.base    item model of the fixed bracket ("" = none)
#   model.broken  head model while DESTROYED
#   model.placer  placement item model (defaults to model.head)
#   model.bbmodel a Blockbench file in plugins/CCTV/models/ that replaces head/base (docs/ASSETS.md: lens at the
#                 origin looking north, bone "head" pans and tilts, clips idle / move / alert / destroyed)
#   look          post-effect look while viewed: standard | night_vision | thermal
#   fallback-anchor  mob used by the mob backend (Minecraft 26.2, or effects.backend: mob): auto (by look:
#                    standard = creeper, night_vision = spider, thermal = enderman) | creeper | spider | enderman | none
types:
  dome:
    name: "<white>Dome Camera"
    model: {head: "cctv:camera_dome_lens", base: "cctv:camera_dome_housing", broken: "cctv:camera_broken", placer: "cctv:camera_dome_item"}
    ptz: false
    fov: 80
    pan: {min: -45, max: 45}
    tilt: {min: -10, max: 50}
    pan-speed: 30
    zoom-levels: [1]
    look: standard
    fallback-anchor: auto
    max-health: 16
    clearance: 0
    model-scale: 1.0
  bullet:
    name: "<white>Bullet Camera"
    model: {head: "cctv:camera_bullet", base: "cctv:camera_bullet_mount", broken: "cctv:camera_broken"}
    ptz: false
    fov: 60
    pan: {min: -30, max: 30}
    tilt: {min: -20, max: 40}
    pan-speed: 30
    zoom-levels: [1]
    look: standard
    fallback-anchor: auto
    max-health: 20
    clearance: 0
    model-scale: 1.0
  ptz:
    name: "<white>PTZ Camera"
    model: {head: "cctv:camera_ptz_head", base: "cctv:camera_ptz_base", broken: "cctv:camera_broken", placer: "cctv:camera_ptz_item"}
    ptz: true
    fov: 70
    pan: {min: -90, max: 90}
    tilt: {min: -20, max: 60}
    pan-speed: 40
    zoom-levels: [1, 2, 4]
    look: standard
    fallback-anchor: auto
    max-health: 24
    clearance: 0
    model-scale: 1.0
  night_vision:
    name: "<green>Night Vision Camera"
    model: {head: "cctv:camera_night_vision", base: "cctv:camera_bullet_mount", broken: "cctv:camera_broken"}
    ptz: false
    fov: 60
    pan: {min: -30, max: 30}
    tilt: {min: -20, max: 40}
    pan-speed: 30
    zoom-levels: [1, 2]
    look: night_vision
    fallback-anchor: auto
    max-health: 20
    clearance: 0
    model-scale: 1.0
  thermal:
    enabled: true
    name: "<gold>Thermal Camera"
    model: {head: "cctv:camera_thermal", base: "cctv:camera_bullet_mount", broken: "cctv:camera_broken"}
    ptz: false
    fov: 50
    pan: {min: -30, max: 30}
    tilt: {min: -20, max: 40}
    pan-speed: 30
    zoom-levels: [1, 2]
    look: thermal
    fallback-anchor: auto
    max-health: 20
    clearance: 2
    model-scale: 1.0

  # Your own model from Blockbench: copy the type below, point model.bbmodel at your file in plugins/CCTV/models/
  example_bb:
    name: "<aqua>Example bbmodel PTZ"
    model: {bbmodel: "example_ptz.bbmodel", head: "cctv:camera_ptz_head", placer: "cctv:camera_ptz_item"}
    ptz: true
    fov: 70
    pan: {min: -90, max: 90}
    tilt: {min: -20, max: 60}
    pan-speed: 40
    zoom-levels: [1, 2, 4]
    look: standard
    fallback-anchor: auto
    max-health: 24
    clearance: 0
    model-scale: 1.0

